name: ci
# CPU-only checks: no secrets, no GPU, no network beyond pip. Nothing here writes or derives a version.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Project version lock
        run: python scripts/release/verify_project_version.py ${{ github.ref_type == 'tag' && format('--tag {0}', github.ref_name) || '' }}
      - name: Tests that need no torch, GPU or the large vLLM wheel
        run: |
          python -m pip install pytest build setuptools packaging jsonschema nbformat
          CUDA_VISIBLE_DEVICES= python -m pytest -q tests/test_version_policy.py tests/test_bundle_discovery.py tests/test_inventory.py tests/test_stage_status.py tests/test_installer_integrated.py tests/test_prohibited_policy.py tests/test_config_strict.py tests/test_readme_examples.py
      - name: Wheel metadata must say the locked version
        run: |
          python -m build --wheel --no-isolation -o /tmp/w .
          python scripts/release/verify_project_version.py --wheel /tmp/w/stokastisk-*.whl
