name: cpu-ci
# The complete CPU-only verification. It never requests a GPU, a Kaggle session or a model: it runs the full test suite, rebuilds the wheel from the byte-pinned vLLM wheel and audits it
# (RECORD, Flash-free, native-binary identity, member delta against the published build 3, reproducibility). Downloads are hash-checked against RELEASE.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/ci.txt -r requirements/docs.txt
      - name: CPU-only PyTorch (the same 2.11.0 the project targets; three test modules import torch and never touch a GPU)
        run: python -m pip install "torch==2.11.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch the byte-pinned vLLM wheel (hash-checked) so no test is skipped for its absence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh release download v0.1.0 -R ${{ github.repository }} -p 'vllm-0.25.1-cp38-abi3-linux_x86_64.whl' -D inputs
          echo "cc3bcafb6516791990ca302073ae153a08465d3df1e460d666e3ec09b4e98f5e  inputs/vllm-0.25.1-cp38-abi3-linux_x86_64.whl" | sha256sum -c -
      - name: Project version lock
        run: python scripts/release/verify_project_version.py
      - name: Full CPU test suite
        run: CUDA_VISIBLE_DEVICES= python -m pytest tests -p no:cacheprovider -q -rs
      - name: Generated documentation is current (API reference, feature matrix)
        run: |
          python scripts/release/build_docs_site.py /tmp/site-docs
          git diff --exit-code docs/guide/api-reference.md docs/guide/feature-matrix.md
      - name: Evidence manifest matches the archived artifacts
        run: |
          python scripts/audit/build_evidence_manifest.py
          git diff --exit-code evidence/kaggle/evidence-manifest.json
  wheel-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/ci.txt
      - name: Fetch the byte-pinned vLLM wheel and the published build 3 (hash-checked, never trusted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs dist/ref
          gh release download v0.1.0 -R ${{ github.repository }} -p 'vllm-0.25.1-cp38-abi3-linux_x86_64.whl' -D inputs
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          rel = json.load(open("RELEASE.json"))
          assert hashlib.sha256(pathlib.Path("inputs/vllm-0.25.1-cp38-abi3-linux_x86_64.whl").read_bytes()).hexdigest() == rel["base_vllm_wheel"]["sha256"]
          for b in ("3", "4"):
              w = rel["builds"][b]; dst = pathlib.Path("dist/ref") / w["filename"]
              urllib.request.urlretrieve(w["url"], dst)
              got = hashlib.sha256(dst.read_bytes()).hexdigest(); assert got == w["sha256"], (b, got)
              print("build", b, "downloaded and verified", got)
          PY
      - name: Build 4 from source, audit it, compare it member by member with build 3, rebuild to prove reproducibility
        run: |
          python scripts/release/build_wheel_release.py --build-tag 4 --out dist/wheel-build4 --reference-wheel dist/ref/stokastisk-0.1.0-3-cp313-cp313-linux_x86_64.whl \
            --allow-sdk stokastisk/compat.py --allow-sdk stokastisk/serving.py --docstring-only stokastisk/serving.py \
            --ast-identical stokastisk/compat.py:check_dtype,check_quantization,check_feature,get_feature,BLOCKING,SM75,QUANT_MIN_CAPABILITY --reproduce
      - name: The rebuilt wheel has exactly the members of the published build 4
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          rel = json.load(open("RELEASE.json")); w = rel["builds"]["4"]
          pub = zipfile.ZipFile("dist/ref/" + w["filename"]); new = zipfile.ZipFile("dist/wheel-build4/" + w["filename"])
          assert sorted(pub.namelist()) == sorted(new.namelist())
          diff = [n for n in pub.namelist() if pub.read(n) != new.read(n)]
          assert not diff, diff[:5]
          same_bytes = hashlib.sha256(open("dist/wheel-build4/" + w["filename"], "rb").read()).hexdigest() == w["sha256"]
          print("all", len(pub.namelist()), "members identical; zip bytes identical to the published file:", same_bytes)
          PY
